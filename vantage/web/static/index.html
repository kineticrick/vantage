<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vantage</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <section class="data-col">
      <header class="topbar">
        <h1>Vantage</h1>
        <button id="refresh-btn">Refresh data</button>
        <span id="refresh-status" class="status"></span>
      </header>
      <div id="overview" class="panel"></div>
      <div id="portfolio" class="panel"></div>
      <div id="signals" class="panel"></div>
      <div id="briefs" class="panel"></div>
      <div id="brief-detail" class="panel" style="display:none"></div>
    </section>
    <aside class="chat-col">
      <div class="chat-head"><span>Analyst</span>
        <button id="chat-new">New conversation</button></div>
      <div id="chat-history">
        <div class="chat-history-head">
          <span>Past conversations</span>
          <button id="chat-history-toggle" type="button">Show</button>
        </div>
        <ul id="chat-history-list" hidden></ul>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <div id="chat-viewing-banner" class="chat-viewing-banner" hidden>
        Viewing a past conversation — press Continue to keep talking
      </div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="2" placeholder="Ask the analyst…"></textarea>
        <button type="submit">Send</button>
      </form>
    </aside>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
